<!DOCTYPE html>
<html>
<head>
    <title>2D CAD - Three.js & Two.js Application</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- External CDN libraries for reliability -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.7.4/two.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Fallback to local files -->
    <script>
        // Check if Three.js loaded, fallback to local
        if (typeof THREE === 'undefined') {
            document.write('<script src="./libs/three/three.js"><\/script>');
            document.write('<script src="./libs/three/controls/TrackballControls.js"><\/script>');
        }
        
        // Check if Two.js loaded, fallback to local
        if (typeof Two === 'undefined') {
            document.write('<script src="./register/templates/js/two.min.js"><\/script>');
        }
    </script>
    
    <!-- Local utilities and main scripts -->
    <script>
        // Basic utility functions inline to avoid dependency issues
        function initStats(type) {
            // Simplified stats function
            return {
                begin: function() {},
                end: function() {},
                update: function() {},
                dom: document.createElement('div')
            };
        }
        
        function initRenderer(props) {
            var renderer = new THREE.WebGLRenderer(props || {});
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setClearColor(new THREE.Color(0x212830));
            renderer.setSize(window.innerWidth, window.innerHeight);
            return renderer;
        }
        
        function onResize() {
            if (window.camera && window.renderer) {
                window.camera.aspect = window.innerWidth / window.innerHeight;
                window.camera.updateProjectionMatrix();
                window.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
    </script>
    
    <!-- Stylesheets -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #212830;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #webgl-output {
            width: 100vw;
            height: 100vh;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
        }
    </style>
</head>

<body>
    <div id="loading">Loading 2D CAD Application...</div>
    <div id="info">
        <h3>2D CAD Application</h3>
        <p>Three.js & Two.js Graphics Engine</p>
        <p>Use mouse to navigate the scene</p>
    </div>
    <div id="webgl-output"></div>
    
    <!-- Simplified main application -->
    <script>
        function init() {
            try {
                // Hide loading message
                document.getElementById('loading').style.display = 'none';
                
                // Listen to resize events
                window.addEventListener('resize', onResize, false);
                
                // Create scene, camera, renderer
                var scene = new THREE.Scene();
                var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000000);
                var renderer = initRenderer();
                
                // Store globally for resize
                window.camera = camera;
                window.renderer = renderer;
                window.scene = scene;
                
                // Add axes helper
                var axisHelper = new THREE.AxesHelper(5);
                axisHelper.scale.z = 0; // Only show x and y axes for 2D CAD
                scene.add(axisHelper);
                
                // Add grid helper
                var gridHelper = new THREE.GridHelper(1000, 100, 0x5B6685, 0x5B6685);
                gridHelper.rotation.x = -0.5 * Math.PI;
                scene.add(gridHelper);
                
                // Position camera
                camera.position.set(0, 0, 100);
                camera.lookAt(scene.position);
                
                // Add lighting
                var ambientLight = new THREE.AmbientLight(0x353535);
                scene.add(ambientLight);
                
                var spotLight = new THREE.SpotLight(0xffffff);
                spotLight.position.set(100, 100, 100);
                spotLight.castShadow = true;
                scene.add(spotLight);
                
                // Add sample geometry for demonstration
                var geometry = new THREE.BoxGeometry(10, 10, 1);
                var material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
                var cube = new THREE.Mesh(geometry, material);
                cube.castShadow = true;
                scene.add(cube);
                
                // Add basic mouse controls
                var mouse = { x: 0, y: 0 };
                var isMouseDown = false;
                
                document.addEventListener('mousedown', function(event) {
                    isMouseDown = true;
                    mouse.x = event.clientX;
                    mouse.y = event.clientY;
                });
                
                document.addEventListener('mouseup', function() {
                    isMouseDown = false;
                });
                
                document.addEventListener('mousemove', function(event) {
                    if (isMouseDown) {
                        var deltaX = event.clientX - mouse.x;
                        var deltaY = event.clientY - mouse.y;
                        
                        camera.position.x -= deltaX * 0.1;
                        camera.position.y += deltaY * 0.1;
                        
                        mouse.x = event.clientX;
                        mouse.y = event.clientY;
                    }
                });
                
                // Mouse wheel zoom
                document.addEventListener('wheel', function(event) {
                    camera.position.z += event.deltaY * 0.1;
                    camera.position.z = Math.max(10, Math.min(1000, camera.position.z));
                });
                
                // Add to DOM
                document.getElementById('webgl-output').appendChild(renderer.domElement);
                
                // Animation loop
                function animate() {
                    requestAnimationFrame(animate);
                    
                    // Rotate the cube slowly
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    
                    renderer.render(scene, camera);
                }
                
                animate();
                
                console.log('2D CAD Application initialized successfully!');
                
            } catch (error) {
                console.error('Error initializing 2D CAD application:', error);
                document.getElementById('loading').innerHTML = 'Error loading application. Please check console for details.';
                document.getElementById('loading').style.color = '#ff4444';
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
